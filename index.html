<title>Sextant</title>
<link rel="canonical" href="https://pkocourek.com/sextant/" />
<!--
  REDIRECT STUB — this is the ONLY thing the old `study-deck` repo serves.

  The app was renamed Study Deck -> Sextant on 2026-08-14 and moved to
  /sextant/. Links to /study-deck/ are already in other people's hands, so this
  path must keep working FOREVER. Do not delete this repo, and never let
  publish.sh point back at it (it force-pushes an orphan commit and would wipe
  this file, stranding every old link).

  ⚠ THE WHOLE POINT: the query string must survive the hop. Share links carry
  ?k=<token>; a bare <meta http-equiv=refresh> to a plain URL silently drops it
  and drops the student on a gate with no access. So the JS below carries
  location.search + location.hash across, and uses location.replace() so the
  dead URL never lands in history and the back button can't bounce.

  The <meta refresh> underneath is the no-JS fallback ONLY. It cannot carry the
  token (HTML has no way to interpolate it) — but the app is a JS app that
  cannot run without JS anyway, so anyone who would be served by that fallback
  could not have used the app regardless. It is there so a no-JS visitor still
  lands somewhere real instead of staring at a blank page.
-->
<script>
  (function () {
    var base = "https://pkocourek.com/sextant/";
    try {
      location.replace(base + (location.search || "") + (location.hash || ""));
    } catch (e) {
      location.href = base;
    }
  })();
</script>
<meta http-equiv="refresh" content="0;url=https://pkocourek.com/sextant/" />

  .ico{width:54px;height:54px;border-radius:12px;margin:0 auto 18px;display:block}
</style>
</head>
